set -g prefix C-a
set -g base-index 1
set -g pane-base-index 1
set -g default-terminal "${TERM}"
set -g terminal-overrides ",*:RGB"
set -g renumber-windows on
set -g mouse on
set -g set-clipboard on
set -g cursor-style blinking-block

set -g status-position top

set -g status-style bg=default,fg=#6c6f93

set -g status-left "#[fg=#26bbd9,bold][#S] "
set -g status-left-length 40

set -g status-right "#[fg=#6c6f93]%H:%M %d-%b #[fg=#fab795]󰥛 #[fg=#e95678]󱑻 #[fg=#ee64ac]󱑺 #[fg=#26bbd9]󰐰 "
set -g status-right-length 40

setw -g window-status-format " #I:#W "
setw -g window-status-current-format " #[fg=#29d398,bold] [ #I:#W ]  "
setw -g window-status-activity-style fg=#fab795
setw -g window-status-bell-style fg=#e95678,bold

set -g pane-border-style fg=#6c6f93
set -g pane-active-border-style fg=#26bbd9
set -g message-style bg=default,fg=#fab795
set -g message-command-style bg=default,fg=#fab795
set -g mode-style bg=#6c6f93,fg=#1c1e26
setw -g clock-mode-colour "#26bbd9"

bind | split-window -h
bind - split-window -v

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'christoomey/vim-tmux-navigator'

set -g @plugin 'tmux-plugins/tmux-yank'

set -g mode-keys vi

run '~/.tmux/plugins/tpm/tpm'
